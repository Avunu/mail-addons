# Generated by odoo-nix for a repository of addons (addons mode): the uv
# project its development environment is built from. `odoo project relock`
# (or `nix run .#relock` outside the shell) rewrites the managed blocks from
# the addons in the repository and the flake inputs linked under .odoo-nix/;
# commit this file and uv.lock beside it. The paths are relative to this
# directory.
[project]
name = "mail-addons"
version = "0"
requires-python = ">=3.11"

# Install roots (lib/oca_sources.py --roots=local): OCB `odoo`, `packaging`,
# and each installable addon of this repository: as odoo-addon-<name> when it
# is packaged, otherwise its external_dependencies.python and the packaged
# modules its depends reach.
dependencies = [
    # >>> odoo-nix: install set (managed from modules.txt) >>>
    "odoo",
    "packaging",
    "odoo-addon-mail_gateway",
    # <<< odoo-nix: install set <<<
]

[dependency-groups]
# Development and test tooling, in the dev environment only. Hand-edited: the
# relock leaves this block alone.
dev = [
    "debugpy",
    "ruff",
    # Odoo's --dev=reload watcher needs a filesystem watcher it does not declare.
    "watchdog",
    # Odoo's test runner imports freezegun, and browser tours need
    # websocket-client (a missing one skips every tour silently).
    "freezegun",
    "websocket-client",
]

[tool.uv]
# A virtual project: the addons load from addons_path.
package = false
# gevent < 23.7 imports pkg_resources, which setuptools >= 81 dropped.
constraint-dependencies = ["setuptools<81"]

# OCB, and the packaged modules of the external sources (non-editable: they
# are store paths). Managed by lib/oca_sources.py; do not edit by hand.
[tool.uv.sources]
# >>> odoo-nix: module sources (managed) >>>
    odoo = { path = "../.odoo-nix/odoo" }
    "odoo-addon-fetchmail_thread_default" = { path = "../.odoo-nix/modules/social/fetchmail_thread_default" }
    "odoo-addon-mail_activity_cancel_tracking" = { path = "../.odoo-nix/modules/social/mail_activity_cancel_tracking" }
    "odoo-addon-mail_activity_unlink_log" = { path = "../.odoo-nix/modules/social/mail_activity_unlink_log" }
    "odoo-addon-mail_gateway" = { path = "../.odoo-nix/modules/social/mail_gateway" }
    "odoo-addon-mail_gateway_instagram" = { path = "../.odoo-nix/modules/social/mail_gateway_instagram" }
    "odoo-addon-mail_gateway_telegram" = { path = "../.odoo-nix/modules/social/mail_gateway_telegram" }
    "odoo-addon-mail_gateway_telegram_standalone" = { path = "../.odoo-nix/modules/social/mail_gateway_telegram_standalone" }
    "odoo-addon-mail_gateway_whatsapp" = { path = "../.odoo-nix/modules/social/mail_gateway_whatsapp" }
    "odoo-addon-mail_mention_suggestion_config" = { path = "../.odoo-nix/modules/social/mail_mention_suggestion_config" }
    "odoo-addon-mail_notification_with_history" = { path = "../.odoo-nix/modules/social/mail_notification_with_history" }
    "odoo-addon-mail_thread_create_nolog" = { path = "../.odoo-nix/modules/social/mail_thread_create_nolog" }
    "odoo-addon-marketing_campaign_budget" = { path = "../.odoo-nix/modules/social/marketing_campaign_budget" }
    "odoo-addon-marketing_campaign_dates" = { path = "../.odoo-nix/modules/social/marketing_campaign_dates" }
    "odoo-addon-res_company_mastodon_link" = { path = "../.odoo-nix/modules/social/res_company_mastodon_link" }
    "odoo-addon-res_partner_linkedin_link" = { path = "../.odoo-nix/modules/social/res_partner_linkedin_link" }
    "odoo-addon-res_partner_mastodon_link" = { path = "../.odoo-nix/modules/social/res_partner_mastodon_link" }
# <<< odoo-nix: module sources <<<

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

# Legacy sdist-only dependencies that do not declare setuptools as a build
# dependency. Maintained from uv.lock (odoo-nix-build-deps).
[tool.uv.extra-build-dependencies]
# >>> odoo-nix: sdist build deps (managed) >>>
"docopt" = ["setuptools"]
"odoo" = ["setuptools"]
"odoo-addon-mail-gateway" = ["setuptools"]
"ofxparse" = ["setuptools"]
"python-ldap" = ["setuptools"]
"rjsmin" = ["setuptools"]
"vobject" = ["setuptools"]
# <<< odoo-nix: sdist build deps (managed) <<<
